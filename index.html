<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OOS PERFORMANCE | Mobile Dashboard</title>
<style>
:root{--navy:#102a43;--blue:#1f5f99;--cyan:#2bb5c4;--bg:#f3f6fa;--card:#fff;--red:#d64545;--green:#12805c;--text:#1e2b38;--muted:#6d7c8b;--line:#dbe4ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:14px}.hero{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:18px 18px 15px;box-shadow:0 8px 24px #17324d22}.hero h1{font-size:24px;margin:0 0 5px}.hero p{margin:0;opacity:.82;font-size:13px}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:14px}.f label{display:block;font-size:10px;font-weight:700;opacity:.8;margin:0 0 4px}.f select{width:100%;border:0;border-radius:9px;padding:10px 8px;background:#fff;color:#20364b;font-weight:600}.kpigrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:13px 0}.kpi{background:#fff;border-radius:14px;padding:13px;border:1px solid #e7edf3;box-shadow:0 3px 10px #18334d0a}.kpi small{color:var(--muted);font-size:10px;font-weight:700}.kpi b{display:block;font-size:22px;margin-top:5px;color:var(--navy)}.kpi.red b{color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:15px;border:1px solid #e4ebf2;padding:14px;box-shadow:0 3px 10px #18334d0a}.card h3{font-size:13px;margin:0 0 13px;color:var(--navy)}.bars{display:flex;align-items:flex-end;height:190px;gap:11px;border-bottom:1px solid var(--line);padding:8px 5px 0}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:35px}.bar{width:68%;max-width:48px;background:linear-gradient(#47b9c7,#1f6a9b);border-radius:7px 7px 0 0;min-height:2px;position:relative}.bar em{position:absolute;top:-18px;width:100%;text-align:center;font-size:10px;font-style:normal;font-weight:700}.barlbl{text-align:center;font-size:9px;color:#617384;margin:5px 0;height:26px;overflow:hidden}.tabs{display:flex;gap:7px;margin:13px 0 9px;overflow:auto}.tab{white-space:nowrap;border:1px solid #cfdbe6;background:#fff;border-radius:18px;padding:8px 13px;font-size:12px;font-weight:700;color:#526575}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.toolbar{display:flex;gap:8px;margin-bottom:9px}.search{flex:1;border:1px solid #cedae6;border-radius:10px;padding:10px}.count{font-size:11px;color:var(--muted);align-self:center}.tablewrap{overflow:auto;max-height:470px}.tbl{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}.tbl th{position:sticky;top:0;background:#173b5d;color:#fff;text-align:left;padding:9px;z-index:1}.tbl td{padding:8px 9px;border-bottom:1px solid #edf1f5}.tbl tbody tr.store-row{cursor:pointer}.tbl tbody tr.store-row:hover{background:#eef6fc}.detail{display:none;background:#f6f9fc}.detail.open{display:table-row}.detailbox{padding:12px}.skurow{display:grid;grid-template-columns:42px minmax(190px,2fr) 95px 62px 62px 62px 105px;gap:8px;align-items:center;padding:7px 9px;margin:5px 0;background:white;border:1px solid #e2eaf1;border-radius:9px}.skuhead{font-size:10px;font-weight:700;color:#698096;background:transparent;border:0}.oosname{font-weight:700;color:#b22b2b}.okname{color:#087452}.toggle{font-weight:700;color:#1f5f99}.onlyoos{border:0;border-radius:14px;background:#fee9e9;color:#ad2d2d;padding:6px 9px;font-size:10px;font-weight:700}.p1{background:#fde2e2!important;color:#a61b1b!important;border-left:4px solid #d92d20!important}.p2{background:#fff0d6!important;color:#9a5a00!important;border-left:4px solid #f79009!important}.p3{background:#fff8cc!important;color:#756000!important;border-left:4px solid #e5c000!important}.priBadge{display:inline-block;padding:3px 7px;border-radius:10px;font-size:9px;font-weight:800;margin-top:3px}.priBadge.p1{border-left:0!important;background:#d92d20!important;color:white!important}.priBadge.p2{border-left:0!important;background:#f79009!important;color:white!important}.priBadge.p3{border-left:0!important;background:#e5c000!important;color:#4d4100!important}.pill{padding:3px 7px;border-radius:8px;font-weight:700}.bad{background:#fde5e5;color:#b22b2b}.good{background:#def4eb;color:#087452}.note{font-size:10px;color:#738394;margin-top:8px}.loader{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:9;font-weight:700;color:var(--navy)}
@media(max-width:760px){.wrap{padding:8px}.hero{border-radius:14px;padding:14px}.hero h1{font-size:20px}.filters{grid-template-columns:1fr 1fr}.kpigrid{grid-template-columns:1fr 1fr 1fr}.kpi{padding:10px}.kpi b{font-size:18px}.grid{grid-template-columns:1fr}.bars{height:160px}.card{padding:11px}.tbl{font-size:10px}}
</style></head><body><div class="loader" id="loader">Đang tải dashboard…</div><div class="wrap"><section class="hero"><h1>OOS PERFORMANCE | 2026 OCT</h1><p>Mobile dashboard • Filter trực tiếp trên dữ liệu Clean Data</p><div class="filters" id="filters"></div></section><div class="kpigrid" id="kpis"></div><div class="grid"><div class="card"><h3>OOS GAP BY NPP</h3><div class="bars" id="nppChart"></div></div><div class="card"><h3>% OOS BY CATEGORY</h3><div class="bars" id="catChart"></div></div></div><div class="tabs"><button class="tab on" data-tab="store">By Store</button><button class="tab" data-tab="npp">By NPP/SUP</button><button class="tab" data-tab="sku">By Category/SKU</button></div><div class="card"><div class="toolbar"><input class="search" id="search" placeholder="Tìm Store / NPP / SKU…"><select class="search" id="priority" style="max-width:210px"><option value="all">Tất cả ưu tiên</option><option value="p1">Ưu tiên 1 • OOS ≥ 75%</option><option value="p2">Ưu tiên 2 • OOS 50–&lt;75%</option><option value="p3">Ưu tiên 3 • OOS &lt;50%</option></select><span class="count" id="count"></span></div><div class="tablewrap"><table class="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="note">Data source: Clean Data • OOS Gap = max(Target − Actual, 0) • %OOS hiển thị theo Stock Gap / Stock Target</div></div></div>
<script>let DATA=[]; const FK=[['Cycle','CYCLE'],['ASM','ASM / SUP'],['NPP','NPP'],['BU','BU'],['Category','CATEGORY'],['Brand','BRAND']];let tab='store';let state={};
function fmt(n){return Number(n||0).toLocaleString('en-US')} function pct(n){return ((n||0)*100).toFixed(1)+'%'}
function unique(k){return [...new Set(DATA.map(x=>x[k]).filter(x=>x!==null&&x!==''))].sort((a,b)=>String(a).localeCompare(String(b),'vi'))}
function init(){let box=document.getElementById('filters');FK.forEach(([k,l])=>{let d=document.createElement('div');d.className='f';d.innerHTML=`<label>${l}</label><select data-k="${k}"><option value="">All</option>${unique(k).map(v=>`<option>${v}</option>`).join('')}</select>`;box.appendChild(d)});box.addEventListener('change',e=>{state[e.target.dataset.k]=e.target.value;render()});document.getElementById('search').oninput=render;document.getElementById('priority').onchange=function(){this.classList.remove('p1','p2','p3');if(this.value!=='all')this.classList.add(this.value);render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;render()});render();document.getElementById('loader').remove()}
function filtered(){return DATA.filter(r=>FK.every(([k])=>!state[k]||String(r[k])===state[k]))}
function pri(o){return o.oos>=.75?'p1':o.oos>=.5?'p2':'p3'}
function agg(rows,key){let m={};rows.forEach(r=>{let k=Array.isArray(key)?key.map(x=>r[x]).join('¦'):r[key];let o=m[k]||(m[k]={key:k,target:0,actual:0,gap:0,set:0,skus:new Set(),stores:new Set(),row:r});o.target+=+r['Stock Target']||0;o.actual+=+r['Stock Actual']||0;o.gap+=Math.max((+r['Stock Target']||0)-(+r['Stock Actual']||0),0);o.set+=+r['Set Audit']||0;o.skus.add(r['DP Name']);o.stores.add(r['Store Code'])});return Object.values(m).map(o=>({...o,oos:o.target?o.gap/o.target:0}))}
function render(){let rows=filtered(), stores=new Set(rows.map(r=>r['Store Code'])), sets=(()=>{let m=new Map();rows.forEach(r=>{let k=String(r['Store Code']??'')+'|'+String(r['NPP']??'');if(k!=='|')m.set(k,+r['Set Audit']||0)});return [...m.values()].reduce((s,v)=>s+v,0)})(),t=rows.reduce((s,r)=>s+(+r['Stock Target']||0),0),a=rows.reduce((s,r)=>s+(+r['Stock Actual']||0),0),g=rows.reduce((s,r)=>s+Math.max((+r['Stock Target']||0)-(+r['Stock Actual']||0),0),0);let vals=[['#STORE AUDIT',stores.size],['#SET AUDIT',sets],['Stock Target',t],['Stock Actual',a],['% Stock',t?pct(a/t):'-'],['% OOS',t?pct(g/t):'-']];document.getElementById('kpis').innerHTML=vals.map((x,i)=>`<div class="kpi ${i==5?'red':''}"><small>${x[0]}</small><b>${typeof x[1]=='number'?fmt(x[1]):x[1]}</b></div>`).join('');chart('nppChart',agg(rows,'NPP').sort((a,b)=>b.oos-a.oos).slice(0,8));chart('catChart',agg(rows,'Category').sort((a,b)=>b.oos-a.oos).slice(0,8));table(rows)}
function chart(id,arr){let mx=Math.max(.01,...arr.map(x=>x.oos));document.getElementById(id).innerHTML=arr.length?arr.map(x=>`<div class="barcol"><div class="bar" style="height:${Math.max(4,x.oos/mx*145)}px"><em>${pct(x.oos)}</em></div><div class="barlbl">${String(x.key||'-').replace('_',' ')}</div></div>`).join(''):'<div class="note">Không có dữ liệu</div>'}
function esc(x){return String(x??'-').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function table(rows){let q=document.getElementById('search').value.toLowerCase(),a,cols;if(tab==='store'){a=agg(rows,['ASM','NPP','Store Code','Store Name']);cols=['ASM','NPP','Store Code','Store Name','SKUs','Target','Actual','Gap','% OOS','Latest Sale Date']}else if(tab==='npp'){a=agg(rows,['ASM','NPP']);cols=['ASM','NPP','Stores','SKUs','Target','Actual','Gap','% OOS']}else{a=agg(rows,['BU','Category','DP Name']);cols=['BU','Category','DP Name','Stores','Target','Actual','Gap','% OOS']}let pv=document.getElementById('priority').value;a=a.filter(o=>(!q||JSON.stringify(o.row).toLowerCase().includes(q)||String(o.key).toLowerCase().includes(q))&&(pv==='all'||pri(o)===pv)).sort((x,y)=>y.oos-x.oos);document.getElementById('count').textContent=fmt(a.length)+' dòng';document.getElementById('thead').innerHTML='<tr>'+cols.map(c=>`<th>${c==='Target'?'Target (SU)':c==='Actual'?'Actual (SU)':c==='Latest Sale Date'?'Latest Sale Date':c}</th>`).join('')+'</tr>';
let body='';a.slice(0,500).forEach((o,i)=>{let r=o.row;let v=cols.map(c=>c==='Stores'?o.stores.size:c==='SKUs'?o.skus.size:c==='Target'?fmt(o.target):c==='Actual'?fmt(o.actual):c==='Gap'?fmt(o.gap):c==='% OOS'?`<span class="pill ${o.oos>=.3?'bad':'good'}">${pct(o.oos)}</span>`:(r[c]??'-'));let cls=tab==='store'?'store-row '+pri(o):tab==='npp'?'store-row '+pri(o):'';body+=`<tr class="${cls}" ${(tab==='store'||tab==='npp')?`onclick="${tab==='store'?'toggleStore':'toggleNPP'}(${i},event)"`:''}>`+v.map((x,j)=>`<td>${j===3&&tab==='store'?'<span class="toggle">▸ '+esc(x)+'</span>':x}</td>`).join('')+'</tr>';if(tab==='store'||tab==='npp')body+=`<tr id="detail-${i}" class="detail"><td colspan="${cols.length}"><div class="detailbox" id="detailbox-${i}"></div></td></tr>`});document.getElementById('tbody').innerHTML=body;window._storeAgg=a;window._filteredRows=rows}
function toggleStore(i,e){let tr=document.getElementById('detail-'+i),box=document.getElementById('detailbox-'+i),o=window._storeAgg[i],r=o.row;if(tr.classList.contains('open')){tr.classList.remove('open');return}document.querySelectorAll('.detail.open').forEach(x=>x.classList.remove('open'));let rr=window._filteredRows.filter(x=>String(x['Store Code'])===String(r['Store Code'])&&String(x['NPP'])===String(r['NPP']));let sk=agg(rr,'DP Name');let pv=document.getElementById('priority').value;let bad=sk.filter(x=>x.gap>0&&(pv==='all'||pri(x)===pv)).sort((a,b)=>b.oos-a.oos||b.gap-a.gap);box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>${esc(r['Store Name'])}</b> <span class="note">(${esc(r['Store Code'])})</span><div class="note">${esc(r['NPP'])} • <b style="color:#b22b2b">${bad.length} SKU OOS</b> / ${sk.length} SKU audit</div></div><button class="onlyoos">OOS SKU</button></div><div class="skurow skuhead"><span>Rank</span><span>SKU</span><span>Category</span><span>Target (SU)</span><span>Actual (SU)</span><span>Gap</span><span>Latest Sale Date</span></div>`+(bad.length?bad.map((x,idx)=>`<div class="skurow ${pri(x)}"><span><b>#${idx+1}</b><br><small>${pct(x.oos)}</small><br><span class="priBadge ${pri(x)}">${pri(x)==="p1"?"P1":pri(x)==="p2"?"P2":"P3"}</span></span><span class="oosname">${esc(x.key)}</span><span>${esc(x.row['Category'])}</span><span>${fmt(x.target)}</span><span>${fmt(x.actual)}</span><span class="pill bad">-${fmt(x.gap)}</span><span>${esc(x.row['Latest Sale Date']||'-')}</span></div>`).join(''):'<div class="note" style="padding:12px">Store này không có SKU OOS theo filter hiện tại.</div>');tr.classList.add('open')}

function toggleNPP(i,e){let tr=document.getElementById('detail-'+i),box=document.getElementById('detailbox-'+i),o=window._storeAgg[i],r=o.row;if(tr.classList.contains('open')){tr.classList.remove('open');return}document.querySelectorAll('.detail.open').forEach(x=>x.classList.remove('open'));let rr=window._filteredRows.filter(x=>String(x['NPP'])===String(r['NPP'])&&String(x['ASM'])===String(r['ASM']));let dp=agg(rr,'DP Name').filter(x=>x.gap>0).sort((a,b)=>b.oos-a.oos||b.gap-a.gap);box.innerHTML=`<div style="margin-bottom:8px"><b>DP Name đang OOS • ${esc(r['NPP'])}</b><div class="note">${dp.length} DP Name OOS • xếp %OOS cao → thấp</div></div><div class="skurow skuhead"><span>Rank</span><span>DP Name</span><span>Category</span><span>Target (SU)</span><span>Actual (SU)</span><span>Gap</span><span>Latest Sale Date</span></div>`+(dp.length?dp.map((x,idx)=>`<div class="skurow ${pri(x)}"><span><b>#${idx+1}</b><br><small>${pct(x.oos)}</small><br><span class="priBadge ${pri(x)}">${pri(x)==='p1'?'P1':pri(x)==='p2'?'P2':'P3'}</span></span><span class="oosname">${esc(x.key)}</span><span>${esc(x.row['Category'])}</span><span>${fmt(x.target)}</span><span>${fmt(x.actual)}</span><span class="pill bad">-${fmt(x.gap)}</span><span>${esc(x.row['Latest Sale Date']||'-')}</span></div>`).join(''):'<div class="note" style="padding:12px">Không có DP Name OOS theo filter hiện tại.</div>');tr.classList.add('open')}
async function loadData(){try{const r=await fetch('./data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);DATA=await r.json();init()}catch(err){const l=document.getElementById('loader');l.innerHTML='<div style="max-width:520px;padding:24px;text-align:center"><b>Không tải được data.json</b><br><span style="font-size:12px;color:#6d7c8b">Hãy mở dashboard qua web hosting và đặt index.html cùng thư mục với data.json.</span></div>';console.error(err)}}loadData();</script></body></html>
