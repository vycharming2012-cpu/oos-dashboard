<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OOS Performance Dashboard</title>
<style>
:root{--navy:#073b66;--teal:#0e9f9a;--red:#dc2626;--bg:#f3f7fa;--card:#fff;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#102a43}.top{background:linear-gradient(135deg,var(--navy),#075985 55%,var(--teal));color:#fff;padding:20px 24px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;opacity:.85}.wrap{max-width:1500px;margin:auto;padding:18px}.filters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;background:#fff;padding:14px;border-radius:14px;box-shadow:0 3px 14px #0f172a12}.filter label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.filter select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:14px 0}.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 3px 14px #0f172a12;border-top:4px solid var(--teal)}.card .v{font-size:25px;font-weight:800;margin-top:6px}.card.red .v{color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#fff;border-radius:14px;padding:15px;box-shadow:0 3px 14px #0f172a12}.panel h3{margin:0 0 12px;color:var(--navy)}.barrow{display:grid;grid-template-columns:150px 1fr 85px;align-items:center;gap:8px;margin:8px 0;font-size:12px}.bar{height:18px;background:#e7eef4;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));border-radius:9px}.tabs{margin-top:14px;display:flex;gap:8px}.tabs button{border:0;border-radius:8px;padding:9px 14px;background:#dbeafe;color:var(--navy);font-weight:700;cursor:pointer}.tabs button.active{background:var(--navy);color:#fff}.tablebox{background:#fff;border-radius:14px;margin-top:10px;overflow:auto;max-height:520px;box-shadow:0 3px 14px #0f172a12}table{border-collapse:collapse;width:100%;font-size:12px}th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:10px;white-space:nowrap}td{padding:8px 10px;border-bottom:1px solid #e5e7eb;white-space:nowrap}td.bad{color:var(--red);font-weight:800}.status{padding:30px;text-align:center;font-weight:700;color:var(--navy)}.foot{text-align:center;color:var(--muted);font-size:11px;padding:15px}@media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.barrow{grid-template-columns:100px 1fr 70px}.top h1{font-size:22px}}</style></head>
<body><header class="top"><h1>OOS PERFORMANCE</h1><p>OOS + Sales KPI + Latest Sale Date + Product Master</p></header><main class="wrap"><div id="status" class="status">Đang tải dữ liệu theo ASM…</div><div id="app" hidden>
<section class="filters" id="filters"></section><section class="cards">
<div class="card"><div>Store Audit</div><div id="kStore" class="v">0</div></div><div class="card"><div>Set Audit</div><div id="kSet" class="v">0</div></div><div class="card"><div>Stock Target</div><div id="kTarget" class="v">0</div></div><div class="card"><div>Stock Actual</div><div id="kActual" class="v">0</div></div><div class="card red"><div>%OOS</div><div id="kOos" class="v">0%</div></div><div class="card red"><div>OOS Value</div><div id="kValue" class="v">0</div></div></section>
<section class="grid"><div class="panel"><h3>%OOS theo NPP</h3><div id="chartNpp"></div></div><div class="panel"><h3>%OOS theo Category</h3><div id="chartCat"></div></div></section>
<div class="tabs"><button class="active" data-tab="store">By Store</button><button data-tab="npp">By NPP</button><button data-tab="sku">By Category/SKU</button></div><div class="tablebox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div><div class="foot">Data được tải từ data/manifest.json và các JSON theo ASM • Ctrl+F5 nếu cần refresh cache</div></main>
<script>
let DATA=[],VIEW=[],TAB='store';const FIELDS=['ASM','NPP','BU','Category','Brand','Set Audit'];const num=v=>Number(v)||0,fmt=v=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:1}).format(v),pct=v=>(100*v).toFixed(1)+'%';
async function load(){try{const v=Date.now(),m=await fetch('data/manifest.json?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Không tìm thấy data/manifest.json');return r.json()});const chunks=await Promise.all(m.files.map(x=>fetch('data/'+x.file+'?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Không tải được '+x.file);return r.json()})));DATA=chunks.flat();buildFilters();document.getElementById('status').hidden=true;document.getElementById('app').hidden=false;apply()}catch(e){document.getElementById('status').innerHTML='Không tải được dữ liệu: '+e.message+'<br>Kiểm tra folder data và manifest.json.'}}
function unique(f){return [...new Set(DATA.map(x=>String(x[f]??'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'))}function buildFilters(){const box=document.getElementById('filters');FIELDS.forEach(f=>{const d=document.createElement('div');d.className='filter';d.innerHTML='<label>'+f+'</label><select data-f="'+f+'"><option value="">Tất cả</option>'+unique(f).map(v=>'<option>'+esc(v)+'</option>').join('')+'</select>';box.appendChild(d)});box.addEventListener('change',apply);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');TAB=b.dataset.tab;renderTable()})}
function apply(){const sels=[...document.querySelectorAll('select[data-f]')];VIEW=DATA.filter(r=>sels.every(s=>!s.value||String(r[s.dataset.f]??'')===s.value));render()}
function sums(a){const t=a.reduce((z,r)=>z+num(r['Stock Target']),0),ac=a.reduce((z,r)=>z+num(r['Stock Actual']),0),gap=a.reduce((z,r)=>z+num(r['Stock Gap']),0),val=a.reduce((z,r)=>z+num(r['Stock Gap'])*num(r['Giá GSV']),0);return{t,ac,gap,o:t?gap/t:0,val}}
function render(){const s=sums(VIEW);kStore.textContent=new Set(VIEW.map(r=>r['Store Code'])).size;kSet.textContent=fmt(VIEW.reduce((z,r)=>z+num(r['Set Audit']),0));kTarget.textContent=fmt(s.t);kActual.textContent=fmt(s.ac);kOos.textContent=pct(s.o);kValue.textContent=fmt(s.val);chart('chartNpp','NPP');chart('chartCat','Category');renderTable()}
function group(field){const m={};VIEW.forEach(r=>{const k=String(r[field]||'Unknown');(m[k]??=[]).push(r)});return Object.entries(m).map(([k,a])=>({k,...sums(a)})).sort((a,b)=>b.o-a.o)}function chart(id,field){const a=group(field).slice(0,10),max=Math.max(...a.map(x=>x.o),.01);document.getElementById(id).innerHTML=a.map(x=>'<div class="barrow"><div title="'+esc(x.k)+'">'+esc(x.k.slice(0,20))+'</div><div class="bar"><div class="fill" style="width:'+(100*x.o/max)+'%"></div></div><b class="'+(x.o>0?'bad':'')+'">'+pct(x.o)+'</b></div>').join('')||'Không có dữ liệu'}
function renderTable(){let rows,cols;if(TAB==='store'){rows=groupRows(['NPP','Store Code','Store Name']);cols=['NPP','Store Code','Store Name','Stock Target','Stock Actual','Stock Gap','%OOS','KPI','Latest Sale Date']}else if(TAB==='npp'){rows=groupRows(['ASM','NPP']);cols=['ASM','NPP','Stock Target','Stock Actual','Stock Gap','%OOS','KPI']}else{rows=groupRows(['Category','DP Name']);cols=['Category','DP Name','Stock Target','Stock Actual','Stock Gap','%OOS','KPI','Latest Sale Date']}thead.innerHTML='<tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';tbody.innerHTML=rows.slice(0,1000).map(r=>'<tr>'+cols.map(c=>'<td class="'+(c==='%OOS'&&r[c]>0?'bad':'')+'">'+display(c,r[c])+'</td>').join('')+'</tr>').join('')}
function groupRows(keys){const m={};VIEW.forEach(r=>{const k=keys.map(x=>r[x]||'').join('|');if(!m[k])m[k]={_a:[],...Object.fromEntries(keys.map(x=>[x,r[x]]))};m[k]._a.push(r)});return Object.values(m).map(x=>{const s=sums(x._a);x['Stock Target']=s.t;x['Stock Actual']=s.ac;x['Stock Gap']=s.gap;x['%OOS']=s.o;x.KPI=x._a.reduce((z,r)=>z+num(r.KPI),0);x['Latest Sale Date']=x._a.map(r=>r['Latest Sale Date']).filter(Boolean).sort().pop()||'';return x}).sort((a,b)=>b['%OOS']-a['%OOS'])}
function display(c,v){if(c==='%OOS')return pct(v);if(['Stock Target','Stock Actual','Stock Gap','KPI'].includes(c))return fmt(v);return esc(String(v??''))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
